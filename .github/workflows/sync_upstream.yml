name: sync_upstream

on:
  schedule:
    # 每天 UTC 19:00（北京时间 03:00）自动同步上游规则
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      - name: 克隆上游规则仓库
        run: git clone --depth 1 https://github.com/Lin-arm/GKD_subscription.git /tmp/upstream

      - name: 生成全量规则文件
        run: node scripts/sync-upstream.mjs
        env:
          UPSTREAM_DIR: /tmp/upstream

      - name: 校验
        run: pnpm run check

      - name: 构建 dist
        run: pnpm run build

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 同步上游规则 $(date -u +%F)"
          git push
